<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#075e54"><title>NOT'S</title><link rel="stylesheet" href="style.css"></head><body>
<div id="authScreen" class="auth-screen"><div class="auth-card"><img src="assets/logo.png" class="auth-logo"><h1>Bem-vindo ao NOT'S</h1><p>Entre com seu e-mail e senha.</p><label>E-mail</label><input id="emailInput" class="auth-input" type="email" inputmode="email" autocomplete="email" placeholder="voce@email.com"><label>Senha</label><input id="passwordInput" class="auth-input" type="password" autocomplete="current-password" placeholder="Mínimo de 8 caracteres"><button id="loginEmail" class="auth-primary">Entrar</button><button id="createEmail" class="auth-secondary">Criar conta</button><small id="authMessage" class="auth-note">Sua conta será conectada ao backend real do NOT'S.</small></div></div>
<div id="app" class="hidden">
<header class="topbar"><div class="brand"><img src="assets/logo.png"><div><b>NOT'S</b><small>mensagens & amigos</small></div></div><div class="top-actions"><button class="profile-mini" id="profileBtn">N</button></div></header>
<main>
<section id="home" class="page active"><div class="search"><span>⌕</span><input id="search" placeholder="Pesquisar conversas"><button id="newChat" aria-label="Nova conversa">＋</button></div><div class="filter-row"><button class="filter active">Todas</button><button class="filter">Não lidas</button><button class="filter">Favoritas</button><button class="filter">Grupos</button></div><div id="chatList" class="list"></div></section>
<section id="groups" class="page"><div class="hero"><div><h2>Grupos</h2><p>Seus grupos aparecem aqui</p></div><button id="createGroup">＋ Criar</button></div><div id="groupList" class="cards"></div></section>
<section id="posts" class="page"><div class="composer"><div class="avatar">N</div><input id="postText" placeholder="No que você está pensando?"><button id="publish">Postar</button></div><div id="feed"></div></section>
<section id="status" class="page"><div class="hero"><div><h2>Atualizações</h2><p>Seus status e os de seus contatos aparecem aqui</p></div><button id="addStatus">＋ Status</button></div><div id="statusList" class="status-list"></div></section>
</main>
<nav><button class="nav active" data-page="home"><span class="navicon nav-chat">💬</span><span>Conversas</span></button><button class="nav" data-page="groups"><span class="navicon nav-groups">👥</span><span>Grupos</span></button><button class="nav" data-page="posts"><span class="navicon nav-posts">📰</span><span>Posts</span></button><button class="nav" data-page="status"><span class="navicon nav-status">◯</span><span>Status</span></button></nav>
</div>
<div id="chatScreen" class="chat-screen" aria-hidden="true"><header class="chat-header"><button id="backChat" class="back">‹</button><div class="avatar small" id="chatAvatar">#</div><div class="chat-person"><b id="chatName">Contato</b><small id="chatPresence">contato</small></div><button class="chat-action" id="videoCall">▣</button><button class="chat-action" id="phoneCall">☎</button><button class="chat-action" id="chatMenu">⋮</button></header><div id="chatbox" class="chatbox"></div><div id="replyBar" class="replybar hidden"><div><small>Respondendo</small><b id="replyText"></b></div><button id="cancelReply">×</button></div><div class="chat-compose"><button id="emojiBtn">☺</button><div class="message-field"><textarea id="msg" rows="1" placeholder="Mensagem"></textarea><button id="attachBtn">⌕</button><button id="cameraBtn">▣</button></div><button id="micBtn" class="send-round mic-round" aria-label="Gravar áudio" title="Gravar áudio">🎙️</button><button id="sendBtn" class="send-round">➤</button></div><div id="emojiTray" class="emoji-tray hidden"><button>😀</button><button>😂</button><button>😍</button><button>👍</button><button>❤️</button><button>🎉</button><button>🙏</button><button>😎</button></div></div>
<div id="modal" class="modal"><div class="sheet"><button id="close">×</button><div id="modalBody"></div></div></div>
<input id="persistentMediaPicker" type="file" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<div id="callScreen" class="call-screen" aria-hidden="true"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video><div class="call-top"><b id="callName">Videochamada</b><small id="callStatus">Conectando…</small></div><div class="call-controls"><button id="callMute" title="Microfone">🎙️</button><button id="callCamera" title="Câmera">📹</button><button id="callFlip" title="Trocar câmera">🔄</button><button id="callEnd" class="call-end" title="Desligar">☎</button></div></div>
</body></html>
